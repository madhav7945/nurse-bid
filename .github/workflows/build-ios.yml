name: Build iOS Apps (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS IPA (${{ matrix.app }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [nurse-app, patient-app]

    env:
      CI: 1
      EXPO_PUBLIC_SUPABASE_URL: "https://kidlqdjfhovjyzcdvygb.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZGxxZGpmaG92anl6Y2R2eWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTM3MjYsImV4cCI6MjEwMzQ2OTcyNn0.sAQM_5UHd7I3ESTsDNdFT_NearO5PaSSMC2zV0bSaxw"
      EXPO_PUBLIC_GROQ_API_KEY: "gsk_dummy_ci_key"

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verify Apple Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: 4. Install Dependencies
        run: |
          npm install --legacy-peer-deps
          cd apps/${{ matrix.app }}
          npm install --legacy-peer-deps

      - name: 5. Generate Native iOS Project (Expo Prebuild)
        run: |
          cd apps/${{ matrix.app }}
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=$EXPO_PUBLIC_GROQ_API_KEY" >> .env
          npx --yes expo prebuild --platform ios --clean --no-install

      - name: 6. Install CocoaPods
        run: |
          cd apps/${{ matrix.app }}/ios
          pod install --repo-update

      - name: 7. Compile iOS IPA Archive
        run: |
          cd apps/${{ matrix.app }}/ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
          
          echo "Compiling workspace: $WORKSPACE with scheme: $SCHEME on macOS..."
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p "$PWD/build/Payload"
          cp -r "$PWD/build/$SCHEME.xcarchive/Products/Applications/"*.app "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r "NurseBid-${{ matrix.app }}.ipa" Payload
          echo "Build complete: NurseBid-${{ matrix.app }}.ipa"

      - name: 8. Upload Compiled IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-ipa
          path: apps/${{ matrix.app }}/ios/build/*.ipa
          retention-days: 14
