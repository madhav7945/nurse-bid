name: Build iOS Apps (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS IPA (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [nurse-app, patient-app]

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Apple Xcode Environment
        uses: maxim-lobachev/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 4. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 5. Generate Native iOS Project (Expo Prebuild)
        run: |
          cd apps/${{ matrix.app }}
          npx expo prebuild --platform ios --clean

      - name: 6. Install CocoaPods
        run: |
          cd apps/${{ matrix.app }}/ios
          pod install --repo-update

      - name: 7. Compile iOS IPA Archive
        run: |
          cd apps/${{ matrix.app }}/ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
          
          echo "Compiling workspace: $WORKSPACE with scheme: $SCHEME on macOS..."
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p "$PWD/build/Payload"
          cp -r "$PWD/build/$SCHEME.xcarchive/Products/Applications/"*.app "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r "NurseBid-${{ matrix.app }}.ipa" Payload
          echo "Build complete: NurseBid-${{ matrix.app }}.ipa"

      - name: 8. Upload Compiled IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-ipa
          path: apps/${{ matrix.app }}/ios/build/*.ipa
          retention-days: 14
