name: Build iOS Apps (.ipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS IPA (${{ matrix.app }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [nurse-app, patient-app]

    env:
      CI: 1
      EXPO_PUBLIC_SUPABASE_URL: "https://kidlqdjfhovjyzcdvygb.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZGxxZGpmaG92anl6Y2R2eWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTM3MjYsImV4cCI6MjEwMzQ2OTcyNn0.sAQM_5UHd7I3ESTsDNdFT_NearO5PaSSMC2zV0bSaxw"
      EXPO_PUBLIC_GROQ_API_KEY: "gsk_dummy_ci_key"

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verify Apple Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: 4. Install Dependencies
        run: |
          npm install --legacy-peer-deps
          cd apps/${{ matrix.app }}
          npm install --legacy-peer-deps

      - name: 5. Generate Native iOS Project (Expo Prebuild)
        run: |
          cd apps/${{ matrix.app }}
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=$EXPO_PUBLIC_GROQ_API_KEY" >> .env
          npx --yes expo prebuild --platform ios --clean --no-install

      - name: 6. Install CocoaPods
        run: |
          cd apps/${{ matrix.app }}/ios
          pod install --repo-update

      - name: 7. Compile iOS App with xcodebuild
        run: |
          cd apps/${{ matrix.app }}/ios
          
          # Crucial: export node binary for React Native build scripts
          export NODE_BINARY=$(which node)
          echo "Using Node Binary at: $NODE_BINARY"
          
          # Detect workspace
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          
          # Extract non-Pods application scheme
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -v '^Pods-' | grep -v 'Pods' | head -n 1)
          
          if [ -z "$SCHEME" ]; then
            SCHEME="${WORKSPACE%.xcworkspace}"
          fi
          
          echo "Compiling Workspace: $WORKSPACE with Application Scheme: $SCHEME"
          
          rm -rf build DerivedData
          
          # Compile with full error tracing
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > xcodebuild.log 2>&1 || {
              echo "=== XCODEBUILD ERROR LOG (LAST 100 LINES) ==="
              tail -n 100 xcodebuild.log
              exit 1
            }

          # Package .app payload into .ipa
          mkdir -p "$PWD/build/Payload"
          APP_PATH=$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle"
            ls -la "$PWD/DerivedData/Build/Products"
            exit 1
          fi
          
          echo "Packaging $APP_PATH into iOS IPA..."
          cp -r "$APP_PATH" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -qr "NurseBid-${{ matrix.app }}.ipa" Payload
          echo "IPA creation successful: $PWD/NurseBid-${{ matrix.app }}.ipa"

      - name: 8. Upload Compiled IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-ipa
          path: apps/${{ matrix.app }}/ios/build/*.ipa
          retention-days: 14
